name: Feature request
description: Suggest an improvement for agentrec
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem should agentrec solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: Which agent framework, CLI, SDK, or workflow would this help?
