name: PR Trace Report

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-report-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  trace-report:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run example agent
        run: npm run example

      - name: Generate trace report
        id: trace
        run: |
          set -euo pipefail
          TRACE_PATH=$(node dist/cli/index.js latest)
          echo "status=$(jq -r '.status' "$TRACE_PATH")" >> "$GITHUB_OUTPUT"
          echo "duration=$(jq -r '.durationMs' "$TRACE_PATH")" >> "$GITHUB_OUTPUT"
          echo "events=$(jq '.events | length' "$TRACE_PATH")" >> "$GITHUB_OUTPUT"
          node dist/cli/index.js report "$TRACE_PATH" --output agentrec-report.html

      - name: Upload report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agentrec-report
          path: agentrec-report.html

      - name: Comment on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          TRACE_STATUS: ${{ steps.trace.outputs.status }}
          TRACE_DURATION: ${{ steps.trace.outputs.duration }}
          TRACE_EVENTS: ${{ steps.trace.outputs.events }}
        with:
          script: |
            const marker = '<!-- agentrec-pr-report -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '### agentrec trace report',
              '',
              `| status | duration | events |`,
              `|---|---|---|`,
              `| ${process.env.TRACE_STATUS} | ${process.env.TRACE_DURATION}ms | ${process.env.TRACE_EVENTS} |`,
              '',
              `Full HTML report: [workflow run](${runUrl})`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
